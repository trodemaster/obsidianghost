name: CI

# Runs on the self-hosted macOS runners. The runner label comes from the
# OBSIDIANGHOST_RUNNER repository variable (default macOS_27); the runner must be
# registered to this repository. Nothing is compiled: the job needs Node from
# MacPorts, and downloads the pinned libghostty-vt wasm (checksum-verified).
#
# Pushing a v* tag whose version matches manifest.json builds the release zip and
# publishes it as a GitHub release (0.x versions are marked pre-release).

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: [self-hosted, "${{ vars.OBSIDIANGHOST_RUNNER || 'macOS_27' }}"]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Toolchain (MacPorts Node)
        run: |
          echo /opt/local/bin >> "$GITHUB_PATH"
          export PATH="/opt/local/bin:$PATH"
          if ! command -v node >/dev/null 2>&1 || [ "$(node -p 'process.versions.node.split(".")[0]')" -lt 20 ]; then
            sudo port -N install nodejs22 npm10
          fi
          sw_vers; uname -m; node --version; npm --version

      - name: Type-check and bundle
        run: make check

      - name: libghostty-vt adapter tests
        run: make test

      - name: Package and verify payload
        run: make verify

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: [self-hosted, "${{ vars.OBSIDIANGHOST_RUNNER || 'macOS_27' }}"]
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Toolchain (MacPorts Node)
        run: |
          echo /opt/local/bin >> "$GITHUB_PATH"
          export PATH="/opt/local/bin:$PATH"
          if ! command -v node >/dev/null 2>&1 || [ "$(node -p 'process.versions.node.split(".")[0]')" -lt 20 ]; then
            sudo port -N install nodejs22 npm10
          fi
          node --version

      - name: Check tag matches manifest version
        run: |
          version="$(node -p 'require("./manifest.json").version')"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match manifest.json version ${version}" >&2
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Build release zip
        run: make release-zip

      - name: Publish GitHub release
        # REST API via curl + node: no gh CLI on the runner VM, whose MacPorts tree
        # is also the blakeports build environment.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: scripts/publish-release.sh
