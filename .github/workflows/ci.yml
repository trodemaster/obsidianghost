name: CI

# Runs on GitHub-hosted macOS by default. To use your own runners, set the repository
# variable OBSIDIANGHOST_RUNS_ON to a JSON runs-on value, e.g. ["self-hosted","macOS_27"]
# (Settings → Secrets and variables → Actions → Variables). Pull requests always run
# on GitHub-hosted runners, so a fork's code never reaches a self-hosted machine.
# Nothing is compiled: the job needs Node and downloads the pinned libghostty-vt wasm
# (checksum-verified).
#
# Pushing a v* tag whose version matches manifest.json builds the release zip and
# publishes it as a GitHub release (0.x versions are marked pre-release).

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ${{ github.event_name == 'pull_request' && 'macos-latest' || fromJSON(vars.OBSIDIANGHOST_RUNS_ON || '"macos-latest"') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/toolchain

      - name: Type-check and bundle
        run: make check

      - name: libghostty-vt adapter tests
        run: make test

      - name: Package and verify payload
        run: make verify

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ${{ github.event_name == 'pull_request' && 'macos-latest' || fromJSON(vars.OBSIDIANGHOST_RUNS_ON || '"macos-latest"') }}
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/toolchain

      - name: Check tag matches manifest version
        run: |
          version="$(node -p 'require("./manifest.json").version')"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match manifest.json version ${version}" >&2
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Build release zip
        run: make release-zip

      - name: Publish GitHub release
        # REST API via curl + node: needs no gh CLI on the runner.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: scripts/publish-release.sh
